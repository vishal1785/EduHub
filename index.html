<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Learn Splash</title>
<meta name="description" content="Learn Splash — a practice app for Grade 7 CBSE: Maths, Science, SST, English, Hindi, German and ICT." />
<meta name="theme-color" content="#2f6f62" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="icon" href="icons/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<!-- ?v= must be bumped with CACHE_NAME in service-worker.js. Without it a
     browser can keep an old stylesheet and render the new markup unstyled. -->
<link rel="stylesheet" href="css/style.css?v=10" />
</head>
<body>

<div class="app-shell">
  <main id="app" role="main" aria-live="polite">
    <div class="screen">
      <div class="empty-state">
        <div class="emoji">📚</div>
        <div class="title">Loading your practice app…</div>
      </div>
    </div>
  </main>
</div>

<nav class="bottom-nav" aria-label="Main navigation">
  <div class="bottom-nav-inner" id="bottom-nav-inner">
    <a class="nav-item" data-route="#/home" href="#/home">
      <span class="nav-icon" aria-hidden="true">🏠</span>
      <span class="nav-label">Home</span>
    </a>
    <a class="nav-item" data-route="#/practice" href="#/practice">
      <span class="nav-icon" aria-hidden="true">📘</span>
      <span class="nav-label">Practice</span>
    </a>
    <a class="nav-item" data-route="#/tests" href="#/tests">
      <span class="nav-icon" aria-hidden="true">📝</span>
      <span class="nav-label">Tests</span>
    </a>
    <a class="nav-item" data-route="#/progress" href="#/progress">
      <span class="nav-icon" aria-hidden="true">📈</span>
      <span class="nav-label">Progress</span>
    </a>
    <a class="nav-item" data-route="#/more" href="#/more">
      <span class="nav-icon" aria-hidden="true">⚙️</span>
      <span class="nav-label">More</span>
    </a>
  </div>
</nav>

<script>
/*
 * Boot watchdog. Deliberately a classic inline script with no imports, so it
 * still runs when the module graph itself fails to load.
 *
 * If js/app.js cannot be linked - a stale cached js/ui.js missing an export
 * that js/app.js imports, say - then NONE of the app's own error handling
 * ever runs and this page would sit on "Loading your practice app..." for
 * ever. That is not a hypothetical: it happened, caused by a service worker
 * serving a mismatched set of modules. This turns that silent hang into a
 * screen with a button that fixes it.
 */
(function () {
  var GRACE_MS = 8000;

  function recover(button) {
    button.disabled = true;
    button.textContent = "Clearing\u2026";
    var jobs = [];
    if ("serviceWorker" in navigator) {
      jobs.push(
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).catch(function () {})
      );
    }
    if (window.caches) {
      jobs.push(
        caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }).catch(function () {})
      );
    }
    Promise.all(jobs).then(function () {
      // A plain reload can still be answered from the browser's own HTTP
      // cache. Navigating to a URL it has never seen cannot be.
      var base = location.pathname.replace(/[?#].*$/, "");
      location.replace(base + "?fresh=" + Date.now() + location.hash);
    });
  }

  setTimeout(function () {
    if (window.__APP_READY) return;
    var app = document.getElementById("app");
    if (!app) return;
    app.innerHTML =
      '<div class="screen"><div class="empty-state">' +
      '<div class="emoji">\uD83D\uDD04</div>' +
      '<div class="title">The app didn\u2019t finish loading</div>' +
      '<div class="desc">This is usually an out-of-date copy saved on this device. ' +
      'Clearing it and reloading fixes it. Your saved progress is not affected.</div>' +
      '<button class="btn-primary" id="boot-recover" type="button" style="margin-top:18px;">Clear cache &amp; reload</button>' +
      '</div></div>';
    var button = document.getElementById("boot-recover");
    if (button) button.addEventListener("click", function () { recover(button); });
  }, GRACE_MS);
})();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
